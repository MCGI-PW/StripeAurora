# Sobe o MongoDB e a API Aurora juntos:  docker compose up -d --build
# A API fica em http://localhost:8080 e o MongoDB em mongodb://localhost:27017
services:
  mongodb:
    image: mongo:7
    container_name: aurora-mongodb
    ports:
      - "27017:27017"
    volumes:
      - aurora-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Aurora/Dockerfile
    container_name: aurora-api
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      Database__Provider: MongoDB
      MongoDb__ConnectionString: mongodb://mongodb:27017
      MongoDb__DatabaseName: aurora
      # Troque estes valores fora do ambiente academico (ou use um arquivo .env, ja ignorado pelo git).
      Jwt__Key: ${JWT_KEY:-troque-esta-chave-por-uma-com-pelo-menos-32-caracteres}
      Auth__AdminEmail: admin@aurora.com
      Auth__AdminPassword: ${ADMIN_PASSWORD:-Admin@2026}

volumes:
  aurora-mongo-data:
